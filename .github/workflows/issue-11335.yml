name: Install iOS 18.2 simulator

on:
  workflow_dispatch:

jobs:
  check:
    strategy:
      matrix: 
        os: [ macos-14 ]
        xcode: [ "16.2" ]

            
    runs-on: ${{ matrix.os }}

    steps:
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ matrix.xcode }}
    - name: Install iOS platform
      run: |
        sudo xcodebuild -downloadPlatform iOS -version 18.2
    - name: Check iOS platform
      shell: powershell
      run: |
        xcrun simctl list -j devices | ConvertFrom-Json
