name: Install iOS 18.2 simulator

on:
  workflow_dispatch:

jobs:
  check:
    strategy:
      matrix: 
        os: [ macos-14 ]
        xcode: [ "16.2" ]

            
    runs-on: ${{ matrix.os }}

    steps:
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ matrix.xcode }}
    - name: Install iOS platform
      run: |
        sudo installer -pkg /path/to/iOS_18.2_Simulator.pkg -target /
        
    - name: Check iOS 18.2 Simulator
      run: |
       xcrun simctl list runtimes
